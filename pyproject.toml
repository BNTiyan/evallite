[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evallite"
version = "1.0.0"
description = "Lightning-Fast, Local-First Agent & Tool-Call Evaluation Engine with Interactive Terminal Dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "BNTiyan", email = "NBR5MTR29@users.noreply.github.com"}
]
keywords = ["evals", "agent", "tool-calling", "llm", "testing", "benchmarks", "cli", "tui", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[project.scripts]
evallite = "evallite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evallite*"]
