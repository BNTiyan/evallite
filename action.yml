name: 'evallite Agent Evaluation Gate'
description: 'Fast, local-first agent & tool-call evaluation with hallucination detection and CI gate enforcement'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  suite:
    description: 'Path to evaluation suite JSON file, or "demo"'
    required: false
    default: 'demo'
  min-accuracy:
    description: 'Minimum acceptable accuracy percentage before failing build'
    required: false
    default: '100'

runs:
  using: 'composite'
  steps:
    - name: Install evallite
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/BNTiyan/evallite.git

    - name: Run evallite verification
      shell: bash
      run: |
        if [ "${{ inputs.suite }}" = "demo" ]; then
          evallite demo --ci
        else
          evallite run "${{ inputs.suite }}" --min-accuracy "${{ inputs.min-accuracy }}" --ci
        fi
